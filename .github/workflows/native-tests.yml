name: Native integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            api: 30
            target: default
            profile: pixel_2
          - name: tv
            api: 36
            target: android-tv
            profile: tv_720p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare synthetic videos and KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo chmod 666 /dev/kvm
          bash tool/native-fixtures.sh /tmp/aniview-native-fixtures
      - uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            python3 -m http.server 8765 --bind 0.0.0.0 --directory /tmp/aniview-native-fixtures > /tmp/fixture-server.log 2>&1 &
            trap 'kill $!' EXIT
            curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/plain/index.m3u8 > /dev/null
            flutter test integration_test/native_test.dart -d emulator-5554 --no-uninstall --dart-define=NATIVE_FIXTURE_URL=http://10.0.2.2:8765
            flutter test integration_test/native_test.dart -d emulator-5554 --no-uninstall --dart-define=NATIVE_FIXTURE_URL=http://10.0.2.2:8765 --dart-define=NATIVE_REQUIRE_RESTART=true
      - name: Capture device diagnostics
        if: always()
        run: |
          mkdir -p native-results
          adb logcat -d > native-results/logcat.txt || true
          adb exec-out screencap -p > native-results/screen.png || true
          adb exec-out run-as com.kidfury.aniview tar -C app_flutter -cf - native-reports > native-results/screens.tar || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-${{ matrix.name }}
          path: native-results
          if-no-files-found: error
