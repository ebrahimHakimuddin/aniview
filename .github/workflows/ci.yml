name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned so a new Flutter release can't turn the build red on its own; bump it with the local fvm version.
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/check_macos_bundle.py

  # Builds each target on its own OS, since none of them cross-compiles; the tests above run on Linux only.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk --debug
          - os: windows-2022
            target: windows --debug
          - os: macos-15
            target: macos --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # Xcode 26's Swift rejects flutter_inappwebview_macos; 16.4 builds it.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}

  # Linux isn't here: flutter_inappwebview_linux needs WPE WebKit 2.50+, which Ubuntu's runners don't have, so tool/appimage.sh runs on a machine that does.
  # Release builds you can download from the run page; the defines come from the DART_DEFINES secret (the contents of dart_defines.env).
  package:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            out: build/AniView-windows-x64-setup.exe
          - os: macos-15
            target: macos
            out: AniView-macos.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # Xcode 26's Swift rejects flutter_inappwebview_macos; 16.4 builds it.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: flutter pub get
      - shell: bash
        run: |
          printf '%s\n' "$DART_DEFINES" > dart_defines.env
          flutter build ${{ matrix.target }} --release --dart-define=TOP_SITES="$(dart tool/top_sites.dart)" --dart-define-from-file=dart_defines.env
        env:
          DART_DEFINES: ${{ secrets.DART_DEFINES }}
      - if: matrix.target == 'windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          # Git Bash would turn /DAppVersion into a path.
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" tool/aniview.iss
      # ditto keeps the app's permissions and symlinks, which a plain copy or artifact upload would drop.
      - if: matrix.target == 'macos'
        run: |
          mkdir dmg
          ditto build/macos/Build/Products/Release/aniview.app dmg/AniView.app
          python3 tool/check_macos_bundle.py dmg/AniView.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname AniView -srcfolder dmg -ov -format UDZO AniView-macos.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aniview-${{ matrix.target }}
          path: ${{ matrix.out }}
