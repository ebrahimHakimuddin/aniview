name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=2

  # Fork PRs get no secrets, but still validate installable packaging.
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            out: build/app/outputs/flutter-apk/*-release.apk
          - os: windows-2022
            target: windows
            out: build/AniView-windows-x64-setup.exe
          - os: macos-15
            target: macos
            out: AniView-macos.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.target == 'apk'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # Xcode 26's Swift rejects flutter_inappwebview_macos; 16.4 builds it.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: flutter pub get --enforce-lockfile
      - name: Restore Android release signing when configured
        if: matrix.target == 'apk'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$KEY_PROPERTIES" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > android/app/aniview-release.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          elif [[ -n "$KEYSTORE" || -n "$KEY_PROPERTIES" ]]; then
            echo 'Both Android signing secrets must be configured.' >&2
            exit 1
          fi
      - name: Build release
        shell: bash
        env:
          DART_DEFINES: ${{ secrets.DART_DEFINES }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '%s\n' "$DART_DEFINES" > dart_defines.env
          args=()
          if [[ "$TARGET" == apk ]]; then args+=(--split-per-abi); fi
          flutter build "$TARGET" --release "${args[@]}" \
            --dart-define=TOP_SITES="$(dart tool/top_sites.dart)" \
            --dart-define-from-file=dart_defines.env
      - if: matrix.target == 'windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" tool/aniview.iss
      - if: matrix.target == 'macos'
        run: |
          mkdir dmg
          ditto build/macos/Build/Products/Release/aniview.app dmg/AniView.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname AniView -srcfolder dmg -ov -format UDZO AniView-macos.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aniview-${{ matrix.target }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  linux:
    needs: check
    runs-on: ubuntu-latest
    # WPE WebKit 2.54 is available here. The artifact inherits its glibc minimum.
    container:
      image: debian:forky-slim@sha256:3c80e257eff6274d593eb33a94bda5174ccd619836e6a728a73e11c97f2213e3
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Bootstrap checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tool/linux-deps.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        env:
          DART_DEFINES: ${{ secrets.DART_DEFINES }}
        run: |
          printf '%s\n' "$DART_DEFINES" > dart_defines.env
          flutter build linux --release \
            --dart-define=TOP_SITES="$(dart tool/top_sites.dart)" \
            --dart-define-from-file=dart_defines.env
      - run: bash tool/appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aniview-linux
          path: AniView-x86_64.AppImage
          if-no-files-found: error
