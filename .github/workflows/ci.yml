name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned so a new Flutter release can't turn the build red on its own; bump it with the local fvm version.
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Builds each target on its own OS, since none of them cross-compiles; the tests above run on Linux only.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk --debug
          - os: windows-2022
            target: windows --debug
          - os: macos-15
            target: macos --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      # Xcode 26's Swift rejects flutter_inappwebview_macos; 16.4 builds it.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }}

  # Release builds you can download from the run page; the defines come from the DART_DEFINES secret (the contents of dart_defines.env).
  package:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            out: AniView-x86_64.AppImage
          - os: windows-2022
            target: windows
            out: build/windows/x64/runner/Release
          - os: macos-15
            target: macos
            out: build/macos/Build/Products/Release/aniview.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libfuse2 libsecret-1-dev libjsoncpp-dev libwpewebkit-1.0-dev
      # Xcode 26's Swift rejects flutter_inappwebview_macos; 16.4 builds it.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: flutter pub get
      - shell: bash
        run: |
          printf '%s\n' "$DART_DEFINES" > dart_defines.env
          flutter build ${{ matrix.target }} --release --dart-define=TOP_SITES="$(dart tool/top_sites.dart)" --dart-define-from-file=dart_defines.env
        env:
          DART_DEFINES: ${{ secrets.DART_DEFINES }}
      - if: matrix.target == 'linux'
        run: tool/appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aniview-${{ matrix.target }}
          path: ${{ matrix.out }}
