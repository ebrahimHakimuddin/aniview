name: Feature request
description: Suggest an idea for AniView
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this isn't suggested yet (if it is, 👍 it instead)
          required: true
  - type: textarea
    attributes:
      label: What problem it solves
      placeholder: Some shows I watch with English subs, others with Spanish, and I have to switch every time.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How you'd like it to work
      placeholder: Remember the last subtitle language I picked for each show.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Platform
      options: [Phone, Android TV, Both]
    validations:
      required: true
